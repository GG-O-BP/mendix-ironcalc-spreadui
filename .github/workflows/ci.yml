name: SpreadUI gates

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mendix-ironcalc-spreadui-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-tests-and-mpk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.20.0
          package-manager-cache: false
      - name: Set up Gleam
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          otp-version: "29"
          gleam-version: "1.18.1"
          rebar3-version: "3"
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0
      - name: Install locked dependencies
        run: |
          bun install --frozen-lockfile
          gleam deps download
      - name: Generate Glendix bindings
        run: gleam run -m glendix/install --runtime bun
      - name: Check source
        run: |
          gleam format --check src test
          gleam check
          gleam build --warnings-as-errors
          gleam docs build
      - name: Run regression tests
        run: |
          gleam test --runtime bun
          bun test test/*.test.mjs
      - name: Build production MPK
        run: gleam run -m glendix/build --runtime bun
      - name: Inspect production package
        run: |
          MPK=$(find dist -name '*.mpk' -type f -print -quit)
          test -n "$MPK"
          unzip -l "$MPK" | grep -q 'MendixIronCalc.xml'
          unzip -l "$MPK" | grep -Eq '\.wasm$'
      - name: Upload MPK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mendix-ironcalc-spreadui-mpk
          path: dist/**/*.mpk
          if-no-files-found: error
