name = "mendix_ironcalc_spreadui"
version = "1.0.1"
gleam = ">= 1.17.0"
target = "javascript"
description = "Practical IronCalc spreadsheet widget for Mendix, built with Glendix"
licences = ["MIT"]
repository = { type = "github", user = "GG-O-BP", repo = "mendix-ironcalc-spreadui" }

[javascript]
runtime = "bun"
typescript_declarations = false

[tools.glendix]
pm = "bun"
compatibility = "experimental-native"

[tools.glendix.bindings]
"@ironcalc/workbook" = ["IronCalc"]

[dependencies]
gleam_stdlib = ">= 1.0.5 and < 2.0.0"
glendix = "5.2.0"
mendraw = ">= 2.0.0 and < 3.0.0"
lustre = ">= 5.7.1 and < 6.0.0"
redraw = ">= 19.2.2 and < 20.0.0"
redraw_dom = ">= 19.2.2 and < 20.0.0"

[dev_dependencies]
gleeunit = ">= 1.11.0 and < 2.0.0"
